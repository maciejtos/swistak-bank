<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Świstak Bank - panel klienta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Świstak Bank</h1>
    </header>

    <nav>
        <a href="panel.html">Panel</a>
        <a href="przelew.html">Nowy przelew</a>
        <a href="historia.html">Historia</a>
        <a href="kantor.html">Kantor</a>
        <a href="logowanie.html">Wyloguj się</a>
    </nav>

    <main>
        <h2>Witaj, <span id="imie"></span></h2>
        <p>Numer rachunku: <span id="numer-rachunku"></span></p>
        <p>Saldo rachunku:</p>
        <p class="saldo"><span id="saldo"></span></p>
    </main>
    <script src="auth.js"></script>
    <script>
        Auth.wymagajLogowania();
        var k = Auth.biezacy();
        if (k) {
            document.getElementById("imie").textContent = (k.imie + " " + k.nazwisko).trim();
            document.getElementById("numer-rachunku").textContent = k.rachunek;
            document.getElementById("saldo").textContent = k.saldo.toLocaleString("pl-PL", { minimumFractionDigits: 2 }) + " zł";
        }
    </script>
</body>

</html>
