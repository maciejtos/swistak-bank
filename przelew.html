<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Świstak Bank - nowy przelew</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Świstak Bank</h1>
    </header>

    <nav>
        <a href="panel.html">Panel</a>
        <a href="przelew.html">Nowy przelew</a>
        <a href="historia.html">Historia</a>
        <a href="kantor.html">Kantor</a>
        <a href="logowanie.html">Wyloguj się</a>
    </nav>

    <main>
        <h2>Nowy przelew</h2>
        <form action="historia.html" method="post">
            <label for="odbiorca">Nazwa odbiorcy</label>
            <input type="text" id="odbiorca" name="odbiorca">

            <label for="rachunek">Numer rachunku odbiorcy</label>
            <input type="text" id="rachunek" name="rachunek">

            <label for="kwota">Kwota (zł)</label>
            <input type="number" id="kwota" name="kwota" step="0.01">

            <label for="tytul">Tytuł przelewu</label>
            <input type="text" id="tytul" name="tytul">

            <button type="submit">Wyślij przelew</button>
        </form>
    </main>
</body>

</html>
